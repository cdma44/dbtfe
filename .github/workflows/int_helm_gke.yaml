name: Deploy to GKE

on:
  push:
    branches:
      - main
      - gke_helm_check

jobs:
  deploy:
    runs-on: ubuntu-latest
#    defaults:
#      run:
#        working-directory: terraform/INT2

    env:
      GOOGLE_PROJECT: project-db-460412
      GKE_CLUSTER: db-cluster
      GKE_REGION: europe-west3-b
      SECRET_NAME: api_key_secret
      K8S_SECRET_NAME: app-secrets
      K8S_SECRET_KEY: api-key
      K8S_NAMESPACE: default
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to GCP using WIF
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ secrets.DB_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DB_GCP_GKE_SERVICE_ACCOUNT_EMAIL }}
          export_default_credentials: true
          install_components: gke-gcloud-auth-plugin

