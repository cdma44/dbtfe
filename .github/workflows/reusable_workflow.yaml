name: Reusable Terraform Workflow

on:
  workflow_call:
    inputs:
      tfe_command:
        required: true
        type: string
        description: "Terraform command to run plan or apply"
      working_directory:
        required: true
        type: string
        description: "Working directory for Terraform"
    secrets:
      GOOGLE_CLOUD_PROJECT:
        required: true
      DB_GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      DB_GCP_GKE_SERVICE_ACCOUNT_EMAIL:
        required: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Needed for OIDC
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Authenticate to Google Cloud with WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DB_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DB_GCP_GKE_SERVICE_ACCOUNT_EMAIL }}
#          token_format: access_token

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        working-directory: ${{ inputs.working_directory }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ inputs.working_directory }}
        run: terraform validate #-input=false -auto-approve

      - name: Terraform import files
        working-directory: ${{ inputs.working_directory }}
        run: |
          terraform import google_container_cluster.primary projects/project-db-460412/locations/europe-west3/clusters/gke-wi-cluster
          terraform import google_service_account.cas_issuer_sa projects/project-db-460412/serviceAccounts/cert-manager-cas-issuer-sa@project-db-460412.iam.gserviceaccount.com
          terraform import google_container_node_pool.primary_nodes projects/project-db-460412/locations/europe-west3/clusters/gke-wi-cluster/nodePools/primary-node-pool
          terraform import google_privateca_ca_pool.ca_pool projects/project-db-460412/locations/us-central1/caPools/sample-ca-pool
          terraform import google_kms_key_ring.cas_ring projects/project-db-460412/locations/global/keyRings/cas-keyring
          terraform import google_kms_crypto_key.cas_key projects/project-db-460412/locations/global/keyRings/cas-keyring/cryptoKeys/cas-crypto-key
#          terraform import google_kms_key_ring.cas_ring projects/project-db-460412/locations/us-central1/keyRings/cas-keyring

      - name: Terraform Plan
        working-directory: ${{ inputs.working_directory }}
        run: terraform plan

      - name: Terraform Apply
        working-directory: ${{ inputs.working_directory }}
        run: terraform ${{ inputs.tfe_command }} -input=false -auto-approve
