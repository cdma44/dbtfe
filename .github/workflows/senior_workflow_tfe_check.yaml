name: Senior Terraform check

on:
  push:
    branches:
      - senior_tfe_check

permissions:
  id-token: write
  contents: read

jobs:
  call-terraform:
    uses: ./.github/workflows/reusable_workflow.yaml
    with:
      working_directory: terraform/INT3
      tfe_command: plan
    secrets:
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      DB_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.DB_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DB_GCP_GKE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.DB_GCP_GKE_SERVICE_ACCOUNT_EMAIL }}
